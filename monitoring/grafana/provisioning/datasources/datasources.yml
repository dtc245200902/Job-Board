apiVersion: 1

datasources:
  # 1. Prometheus Metrics Data Source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus-ds
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  # 2. Loki Logs Data Source
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    uid: loki-ds
    editable: true
    jsonData:
      maxLines: 1000
