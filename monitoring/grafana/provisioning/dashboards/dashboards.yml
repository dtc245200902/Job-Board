apiVersion: 1

providers:
  - name: 'JobBoard Dashboards'
    orgId: 1
    folder: 'Job Board Systems'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
